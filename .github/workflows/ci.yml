name: "CI"

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  CI:
    if: ${{ github.repository == 'googleapis/google-cloudevents-ruby' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            ruby: "3.2"
            task: test
          - os: ubuntu-latest
            ruby: "3.3"
            task: test
          - os: ubuntu-latest
            ruby: "3.4"
            task: test
          - os: ubuntu-latest
            ruby: "4.0"
            task: test
          - os: macos-latest
            ruby: "4.0"
            task: test
          - os: windows-latest
            ruby: "4.0"
            task: test
          - os: ubuntu-latest
            ruby: "4.0"
            task: rubocop , yardoc , build
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      # 1. Setup Environment (Cross-Platform)
      # We force 'bash' so we can use standard linux syntax on Windows too.
      - name: Setup Gem Environment
        shell: bash
        run: |
          # Use the safe runner temp dir
          GEM_DIR="$RUNNER_TEMP/gem_home"

          # Export for future steps
          echo "GEM_HOME=$GEM_DIR" >> $GITHUB_ENV
          echo "GEM_PATH=$GEM_DIR" >> $GITHUB_ENV

          # Add bin to PATH so installed gem executables work
          echo "$GEM_DIR/bin" >> $GITHUB_PATH
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "${{ matrix.ruby }}"
          bundler-cache: false
      - name: Install dependencies
        shell: bash
        run: bundle install
      - name: Run CI
        shell: bash
        run: |
          for task in $(echo "${{ matrix.task }}" | tr ',' ' '); do
            bundle exec rake "$task" < /dev/null
          done
